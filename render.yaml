services:
  - type: web
    name: allowance-platform
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    disk:
      name: allowance-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8000
      - key: DB_PATH
        value: /data/allowance.db
      - key: PAYPAL_MODE
        value: mock
      - key: ALLOW_DEMO_RESET
        value: "true"
      - key: PYTHONPATH
        value: "."

