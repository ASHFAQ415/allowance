# Render Blueprint for Allowance v5.0
# 100% Free-Tier Compatible (no paid persistent disks required)
services:
  - type: web
    name: allowance-platform
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: DB_PATH
        value: "/tmp/allowance.db"
      - key: PAYPAL_MODE
        value: mock
      - key: ALLOW_DEMO_RESET
        value: "true"
      - key: PYTHONPATH
        value: "."
